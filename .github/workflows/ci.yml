name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync vendored packages
        run: pnpm run sync-vendored

      - name: Typecheck
        run: pnpm --filter ./apps/web exec svelte-kit sync && pnpm --filter ./apps/web exec svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Test (pathway-rules)
        run: pnpm --filter @gnps-civic/pathway-rules test

      - name: Test (nysed-export)
        run: pnpm --filter @gnps-civic/nysed-export test

      - name: Build
        run: pnpm --filter ./apps/web build
