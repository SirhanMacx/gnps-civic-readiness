name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync vendored packages
        run: pnpm run sync-vendored

      - name: Typecheck
        run: |
          pnpm --filter ./apps/web exec svelte-kit sync
          pnpm --filter ./apps/web exec svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Test (pathway-rules)
        run: pnpm --filter @gnps-civic/pathway-rules test

      - name: Test (nysed-export)
        run: pnpm --filter @gnps-civic/nysed-export test

      - name: Test (web app)
        run: pnpm --filter ./apps/web test

      - name: Build (SvelteKit adapter output)
        run: pnpm --filter ./apps/web build

      - name: Build (Node adapter — self-host)
        env:
          SVELTE_ADAPTER: node
        run: pnpm --filter ./apps/web build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build app Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gnps-civic-readiness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose syntax
        env:
          # Placeholder values just to satisfy compose's "required" interpolation checks.
          # docker compose config doesn't actually launch anything.
          CIVICSEAL_DOMAIN: ci.example.local
          POSTGRES_PASSWORD: ci-test-only-password
          SESSION_SECRET: ci-test-only-session-secret-32-chars-min
          SIGNED_LINK_SECRET: ci-test-only-signed-link-secret-32-chars
          EMAIL_FROM: "GNPS Civic Readiness <ci@example.local>"
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          echo "✓ docker-compose.yml is valid"
