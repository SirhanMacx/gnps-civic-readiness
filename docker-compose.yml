# GNPS Civic Readiness Portal — self-hosted stack.
#
# Brings up:
#   - Postgres 16 (persistent volume, internal-only)
#   - One-shot migration runner that applies supabase/migrations/*.sql
#   - The SvelteKit app on port 3000 (internal)
#   - Caddy reverse proxy with automatic Let's Encrypt SSL on 80/443
#
# Quick start:
#   1. Copy .env.example to .env and fill in values
#   2. Make sure the domain in CIVICSEAL_DOMAIN points to this server's public IP
#   3. docker compose up -d
#   4. Watch logs: docker compose logs -f
#   5. Visit https://${CIVICSEAL_DOMAIN}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicseal}
      POSTGRES_USER: ${POSTGRES_USER:-civicseal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-civicseal}", "-d", "${POSTGRES_DB:-civicseal}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # No public port exposed — only the app talks to db on the internal network.

  db-migrate:
    image: node:22-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-civicseal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civicseal}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./scripts:/scripts:ro
    working_dir: /scripts
    command: ["sh", "-c", "npm install --silent --no-package-lock postgres && node run-migrations.mjs"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-civicseal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civicseal}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SIGNED_LINK_SECRET: ${SIGNED_LINK_SECRET:?SIGNED_LINK_SECRET must be set}
      PUBLIC_APP_URL: https://${CIVICSEAL_DOMAIN}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
      EVIDENCE_DIR: /app/evidence-data
    volumes:
      - evidence-data:/app/evidence-data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      CIVICSEAL_DOMAIN: ${CIVICSEAL_DOMAIN:?CIVICSEAL_DOMAIN must be set (e.g. civicseal.example.k12.ny.us)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  evidence-data:
  caddy-data:
  caddy-config:
